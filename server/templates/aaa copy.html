<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Requested Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <style>
        /* Reset & Background Setup */
        body {
            margin: 0;
            padding: 40px;
            background-color: #333;
            /* Dark background to see the white overlay properly */
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }

        /* Main Container */
        .vr-container {
            display: inline-flex;
            height: 60px;
            /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); */
            user-select: none;
            gap: 2px;
        }

        /* --- LEFT RED BADGE --- */
        .vr-badge {
            position: relative;
            background-color: #FFA000;
            /* Vivid red */
            width: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-text {
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 700;
            /* Account for the top stripe centering */
        }

        /* --- RIGHT CONTENT AREA --- */
        .vr-content {
            display: flex;
            flex-direction: column;
            min-width: 280px;
            gap: 2px;
        }

        /* Top Dark Header */
        .content-header {
            background-color: #212121;
            /* Rich off-black */
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 700;
            padding: 2px 16px 0 16px;
            height: 42px;
            display: flex;
            align-items: center;
        }

        /* Bottom White/Slanted Subtitle Bar */
        .content-sub {
            position: relative;
            background-color: #F5F5F5;
            /* Crisp off-white */
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 0 16px;
            height: 28px;
            display: flex;
            align-items: center;
        }
    </style>

    <div class="vr-container">

        <div class="vr-badge">
            <span class="badge-text">VR</span>
        </div>

        <div class="vr-content">
            <div class="content-header">
                VIDEO REPLAY REQUESTED
            </div>
            <div class="content-sub">
                PENDING OFFICIAL DECISION
            </div>
        </div>

    </div>

</body>

</html>
